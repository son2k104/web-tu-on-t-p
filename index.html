      {"title": "Câu 2. Đọc đoạn tư liệu:", "passage": "“Bằng tham vọng và sức mạnh quân sự vượt trội, đặc biệt là lực lượng hải quân, đến cuối thế kỉ XIX, đầu thế kỉ XX, thực dân Anh đã lần lượt xâm chiếm nhiều thuộc địa trên thế giới. Bức tranh biếm họa “Người khổng lồ Rốt-đơ” trên một tạp chí ở Anh năm 1892 miêu tả tham vọng của Xê-xin Rốt-đơ, một ông trùm khai thác mỏ và chính trị gia người Anh, về việc xây dựng một tuyến đường sắt và điện báo kết nối các thuộc địa của Anh ở châu Phi.”", "items": [{"text": "a. Đoạn tư liệu trên phản ánh quá trình giành giật thuộc địa giữa hai đế quốc Anh và Pháp.", "correct": false}, {"text": "b. Cuối thế kỉ XIX đầu thế kỉ XX, Anh là nước có hệ thống thuộc địa rộng lớn nhất thế giới.", "correct": true}, {"text": "c. Khu vực châu Phi là thuộc địa duy nhất của thực dân Anh.", "correct": false}, {"text": "d. Bức tranh biếm họa “Người khổng lồ Rốt-đơ” phản ánh quá trình đầu hàng của các nước châu Phi trước sự xâm lược của thực dân Anh.", "correct": false}]},
      {"title": "Câu 3. Đọc đoạn tư liệu:", "passage": "“Liên Xô, nhà nước chuyên chính vô sản đầu tiên, đã tỏ ra có sức mạnh phi thường. Ngay từ khi mới thành lập, Liên Xô chẳng những đập tan được bọn phản cách mạng trong nước, mà còn đánh thắng cuộc can thiệp vũ trang của 14 nước đế quốc, chưa đầy 30 năm sau lại đánh thắng hoàn toàn bọn phát xít Đức - Ý - Nhật, chẳng những bảo vệ được Nhà nước Xô viết mình mà còn góp phần to lớn giải phóng nhiều nước khác, cứu cả loài người khỏi ách nô lệ của chủ nghĩa phát xít.”", "items": [{"text": "a. Liên Xô là một trong những nhà nước chuyên chính vô sản đầu tiên trên thế giới.", "correct": true}, {"text": "b. Nhà nước Liên Xô bắt đầu tỏ ra có sức mạnh phi thường từ sau khi đánh bại phát xít.", "correct": false}, {"text": "c. Việc Liên Xô đánh thắng phát xít đã tạo điều kiện cho nhiều nước khác đứng lên tự giải phóng.", "correct": true}, {"text": "d. Đoạn trích đã tóm tắt quá trình thành lập Liên bang Cộng hòa xã hội chủ nghĩa Xô viết.", "correct": false}]},
      {"title": "Câu 4. Đọc đoạn tư liệu:", "passage": "“Đến năm 1922, nước Nga Xô viết và các nước cộng hòa Xô viết đồng minh có sự phát triển không đồng đều về kinh tế, văn hóa, chính trị. Trong khi Nga là nước có nền kinh tế công nghiệp tương đối phát triển (nhờ thực hiện chính sách Kinh tế mới), các nước khác vẫn trong tình trạng nông nghiệp lạc hậu. Các nước cộng hòa Xô viết cũng chưa có sự thống nhất về các chính sách phát triển kinh tế, văn hóa, giáo dục,… Điều đó đặt ra yêu cầu phải hợp tác, giúp đỡ lẫn nhau để cùng phát triển.”", "items": [{"text": "a. Liên bang Cộng hòa xã hội chủ nghĩa Xô viết được thành lập năm 1922 trong bối cảnh kinh tế nước Nga và các nước Xô viết khác có sự phát triển tương đối đồng đều.", "correct": false}, {"text": "b. Một trong những nguyên nhân thúc đẩy sự thành lập Liên bang Cộng hòa xã hội chủ nghĩa Xô viết là do nhu cầu hợp tác, giúp đỡ nhau để cùng phát triển.", "correct": true}, {"text": "c. Trước khi thành lập Liên bang Xô viết, các nước cộng hòa Xô viết đã có sự thống nhất bước đầu về các chính sách phát triển.", "correct": false}, {"text": "d. Năm 1922, kinh tế nước Nga phát triển là do thực hiện chính sách Kinh tế mới.", "correct": true}]},
      {"title": "Câu 5. Đọc đoạn tư liệu:", "passage": "“Điểm chung của chính sách thống trị thực dân ở Đông Nam Á là khai thác, vơ vét và bòn rút các quốc gia trong khu vực bằng chính sách thuế khóa đánh vào các tầng lớp nhân dân bản địa, cướp ruộng đất lập đồn điền, bóc lột sức người, khai thác tài nguyên; thông qua khai thác triệt để sản phẩm nông nghiệp, tiếp tục đầu tư để bóc lột lâu dài trong công nghiệp… Vì vậy, cao su, cà phê, chè, lúa gạo là những sản vật đặc trưng của Đông Nam Á được thực dân phương Tây chú ý khai thác từ sớm.”", "items": [{"text": "a. Đoạn trích cung cấp thông tin về chính sách khai thác, bóc lột của thực dân phương Tây đối với khu vực Đông Nam Á.", "correct": true}, {"text": "b. Trong công nghiệp, thực dân phương Tây tìm cách vơ vét, bòn rút các nước Đông Nam Á thông qua việc cướp ruộng đất lập đồn điền.", "correct": false}, {"text": "c. Những sản vật được coi là thế mạnh của các nước Đông Nam Á được thực dân phương Tây chú ý đầu tư khai thác sớm để thu lợi nhuận cao.", "correct": true}, {"text": "d. Khai thác tài nguyên thiên nhiên không phải là điểm chung trong chính sách cai trị của thực dân phương Tây ở Đông Nam Á.", "correct": false}]},
      {"title": "Câu 6. Đọc đoạn tư liệu:", "passage": "“Các cuộc cách mạng tư sản đều giành thắng lợi, lật đổ chế độ phong kiến, thực dân và thiết lập chế độ tư bản chủ nghĩa. Do điều kiện lịch sử ở mỗi nước khác nhau nên thắng lợi của các cuộc cách mạng tư sản cũng khác nhau. Cách mạng tư sản Anh đã lật đổ chế độ quân chủ chuyên chế, thiết lập chế độ quân chủ lập hiến. Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ đã lật đổ sự thống trị của thực dân Anh, giành được độc lập dân tộc. Cách mạng tư sản Pháp đã lật đổ chế độ quân chủ chuyên chế, thiết lập chế độ cộng hòa.”", "items": [{"text": "a. Mức độ thắng lợi của các cuộc cách mạng tư sản phụ thuộc vào điều kiện lịch sử của mỗi nước.", "correct": true}, {"text": "b. Sau cuộc cách mạng tư sản thế kỉ XVII, nước Anh thiết lập chế độ Cộng hòa.", "correct": false}, {"text": "c. Điểm chung của các cuộc cách mạng tư sản là thiết lập chế độ tư bản chủ nghĩa, mở đường cho kinh tế hàng hóa phát triển.", "correct": true}, {"text": "d. Cách mạng tư sản Anh, Pháp, Mĩ thế kỉ XVII - XVIII đều lật đổ chế độ phong kiến, thiết lập chế độ quân chủ lập hiến.", "correct": false}]},
      {"title": "Câu 7. Đọc đoạn tư liệu:", "passage": "“Cuối thế kỉ XIX đầu thế kỉ XX, các nước tư bản Âu - Mĩ bước sang giai đoạn đế quốc chủ nghĩa, gắn liền với việc mở rộng quyền lực và tầm ảnh hưởng thông qua hoạt động xâm lược thuộc địa bằng vũ lực hoặc các phương thức khác.”", "items": [{"text": "a. Cuối thế kỉ XIX đầu thế kỉ XX, các nước tư bản chủ nghĩa chuyển sang giai đoạn đế quốc chủ nghĩa.", "correct": true}, {"text": "b. Các nước đế quốc xâm lược thuộc địa bằng nhiều phương thức khác nhau.", "correct": true}, {"text": "c. Chủ nghĩa đế quốc ra đời gắn liền với chính sách mở rộng và duy trì quyền kiểm soát hoặc ảnh hưởng đối với các quốc gia hay dân tộc yếu hơn ở châu Âu và châu Mĩ.", "correct": false}, {"text": "d. Sử dụng sức mạnh quân sự là phương thức xâm lược thuộc địa chủ yếu của các nước tư bản châu Âu.", "correct": false}]},
      {"title": "Câu 8. Đọc đoạn tư liệu:", "passage": "“Hội nghị Trung ương 3 (khóa XI) của Ban Chấp hành Trung ương Đảng Cộng sản Trung Quốc (12/1978) đã quyết định thực hiện cải cách, mở cửa, xây dựng hiện đại hóa xã hội chủ nghĩa. Đường lối này được nâng lên thành đường lối chung tại Đại hội XII (1982) và Đại hội XIII (1987): lấy phát triển kinh tế làm trung tâm, tiến hành cải cách, mở cửa, chuyển nền kinh tế kế hoạch hóa tập trung sang nền kinh tế thị trường xã hội chủ nghĩa linh hoạt hơn nhằm hiện đại hóa và xây dựng chủ nghĩa xã hội đặc sắc Trung Quốc, với mục tiêu biến Trung Quốc thành quốc gia giàu mạnh, dân chủ và văn minh.”", "items": [{"text": "a. Tại Đại hội XIII (1987), Ban Chấp hành Trung ương Đảng Cộng sản Trung Quốc đã quyết định cải cách, mở cửa đất nước.", "correct": false}, {"text": "b. Công cuộc cải cách, mở cửa của Trung Quốc nhằm mục tiêu cuối cùng là chuyển đổi cách thức hoạt động của nền kinh tế theo hướng hiện đại.", "correct": false}, {"text": "c. Nội dung đường lối cải cách - mở cửa ở Trung Quốc được xây dựng và hoàn thiện trong khoảng thời gian từ 1978 đến 1987.", "correct": true}, {"text": "d. Trong nội dung đường lối cải cách, mở cửa, Trung Quốc xác định sẽ xây dựng một mô hình xã hội chủ nghĩa mang màu sắc riêng của đất nước mình.", "correct": true}]},
      {"title": "Câu 9. Đọc đoạn tư liệu:", "passage": "Tại Bảo tàng hàng hải ở Ma-lắc-ca (Ma-lai-xi-a), mô hình con tàu Phlo đơ Ma của Bồ Đào Nha bị đắm ở Ma-lắc-ca thu hút sự chú ý của đông đảo khách tham quan. Đây là một trong số những con tàu thuộc hạm đội hùng mạnh của thực dân Bồ Đào Nha tấn công xâm lược Vương quốc Ma-lắc-ca, cũng là một thương cảng sầm uất ở Đông Nam Á vào năm 1511. Sự kiện này đã mở đầu cho quá trình xâm lược và thống trị kéo dài nhiều thế kỉ của thực dân phương Tây ở Đông Nam Á.", "items": [{"text": "a. Đoạn trích tập trung phản ánh sự phát triển của du lịch tại thành phố biển Ma-lắc-ca.", "correct": false}, {"text": "b. Bồ Đào Nha là nước thực dân phương Tây đầu tiên xâm lược khu vực Đông Nam Á.", "correct": true}, {"text": "c. Thực dân phương Tây bắt đầu quá trình xâm lược khu vực Đông Nam Á từ thế kỉ XV.", "correct": false}, {"text": "d. Một trong những nguyên nhân khiến Bồ Đào Nha xâm lược Ma-lắc-ca vì đây là một hải cảng sầm uất ở biển Đông.", "correct": true}]}
    ]},
  "gdkt11": {"id": "gdkt11", "title": "GDKT & PL 11", "subtitle": "Giáo dục kinh tế & pháp luật", "desc": "Ôn tập giữa HK1: cạnh tranh, cung – cầu và các tình huống kinh tế – pháp luật thực tế.", "icon": "⚖️", "color": "emerald",
    "p1": [
      {"q": "Sự tranh đua giữa các chủ thể kinh tế nhằm có được những ưu thế trong sản xuất, tiêu thụ hàng hóa, qua đó thu được lợi nhuận tối đa là nội dung của khái niệm", "options": ["cạnh tranh.", "thi đua.", "thị trường.", "lao động."], "answer": 0},
      {"q": "Một trong những đặc trưng cơ bản phản ánh sự cạnh tranh giữa các chủ thể kinh tế là giữa họ luôn luôn có sự", "options": ["thỏa hiệp.", "thỏa mãn.", "ký kết.", "tranh đua."], "answer": 3},
      {"q": "Trong nền kinh tế thị trường, các chủ thể kinh tế tranh đua với nhau nhằm có được", "options": ["niềm tin tuyệt đối.", "thương hiệu độc quyền.", "ưu thế trong sản xuất.", "bản quyền âm nhạc."], "answer": 2},
      {"q": "Người sản xuất, kinh doanh luôn giành lấy các điều kiện thuận lợi, tránh được những rủi ro, bất lợi trong sản xuất và lưu thông hàng hóa, dịch vụ là một trong những", "options": ["nguyên nhân của sự ra đời hàng hóa.", "tính chất của cạnh tranh.", "nguyên nhân dẫn đến cạnh tranh.", "nguyên nhân của sự giàu nghèo."], "answer": 2},
      {"q": "Trong nền kinh tế thị trường, một trong những nguyên nhân dẫn đến cạnh tranh là do sự tồn tại của nhiều chủ sở hữu có điều kiện sản xuất và lợi ích", "options": ["bằng nhau.", "giống nhau.", "khác nhau.", "cào bằng."], "answer": 2},
      {"q": "Trong kinh tế thị trường, sự tồn tại của nhiều chủ sở hữu với tư cách là những đơn vị kinh tế độc lập, tự do trong sản xuất, kinh doanh, có điều kiện sản xuất và lợi ích khác nhau đã dẫn đến hiện tượng nào sau đây?", "options": ["Cung - Cầu.", "Lạm phát.", "Thất nghiệp.", "Cạnh tranh."], "answer": 3},
      {"q": "Trong sản xuất và kinh doanh hàng hóa, nội dung nào dưới đây không thể hiện mặt tích cực của cạnh tranh?", "options": ["Áp dụng khoa học – kĩ thuật tiên tiến.", "Thúc đẩy tăng trưởng kinh tế.", "Giảm thiểu chi phí sản xuất.", "Bán hàng giả gây rối thị trường."], "answer": 3},
      {"q": "Trong nền kinh tế thị trường, mỗi chủ thể kinh tế tạo ra năng suất và chất lượng sản phẩm khác nhau, dẫn đến giữa các sản phẩm có sự cạnh tranh của yếu tố nào dưới đây?", "options": ["Giá trị và số lượng.", "Giá cả và chất lượng.", "Năng suất lao động.", "Giá trị sử dụng."], "answer": 1},
      {"q": "Nội dung nào dưới đây thể hiện vai trò tích cực của cạnh tranh trong nền kinh tế?", "options": ["Hủy hoại tài nguyên môi trường.", "Triệt tiêu mọi lợi nhuận kinh doanh.", "Thúc đẩy tăng trưởng kinh tế.", "Tăng cường đầu cơ tích trữ."], "answer": 2},
      {"q": "Nội dung nào dưới đây thể hiện vai trò tích cực của cạnh tranh trong nền kinh tế?", "options": ["Khai thác cạn kiệt tài nguyên.", "Sử dụng những thủ đoạn phi pháp.", "Làm hàng giả, hàng nhái.", "Thúc đẩy lực lượng sản xuất phát triển."], "answer": 3},
      {"q": "Biện pháp nào dưới đây không phải là hình thức để thực hiện cạnh tranh lành mạnh giữa các doanh nghiệp trong nền kinh tế thị trường?", "options": ["Giảm phí trước bạ cho khách hàng.", "Hỗ trợ mua bảo hiểm cho khách hàng.", "Lừa dối khi khuyến mại cho khách hàng.", "Hỗ trợ lãi xuất ưu đãi cho khách hàng."], "answer": 2},
      {"q": "Với các giải pháp ưu đãi kích cầu của các doanh nghiệp ô tô cuối năm, cầu về mặt hàng ô tô có xu hướng diễn biến", "options": ["tăng.", "giảm.", "cân bằng.", "giữ nguyên."], "answer": 0},
      {"q": "Trong sản xuất và lưu thông hàng hóa, cầu là lượng hàng hóa, dịch vụ mà người tiêu dùng sẵn sàng mua với một mức giá nhất định trong khoảng", "options": ["lao động cá biệt.", "chi phí sản xuất.", "thời gian xác định.", "thu nhập cá nhân."], "answer": 2},
      {"q": "Nội dung nào dưới đây là một trong những nhân tố ảnh hưởng đến lượng cầu?", "options": ["Tình trạng lạm phát.", "Lao động cá biệt.", "Giá cả hàng hóa.", "Giá trị thặng dư."], "answer": 2},
      {"q": "Nội dung nào dưới đây không phải là nhân tố ảnh hưởng đến lượng cung hàng hóa trên thị trường?", "options": ["Yếu tố đầu vào để sản xuất hàng hóa.", "Kì vọng của chủ thể sản xuất.", "Số lượng người tham gia cung ứng.", "Sự phân hóa giàu nghèo trong xã hội."], "answer": 3},

    "p2": [
      {"title": "Câu 1. Mạch kiến thức: Khu vực hóa kinh tế", "passage": "Khu vực hóa kinh tế diễn ra mạnh mẽ trên cơ sở sự tương đồng về địa lí, văn hóa, xã hội hoặc mục tiêu phát triển giữa các quốc gia trong cùng khu vực. Quá trình này hình thành nên các tổ chức liên kết như EU, ASEAN, MERCOSUR,... Sự tự do hóa thương mại, đầu tư nội khối giúp các nước thành viên mở rộng thị trường, thúc đẩy tăng trưởng kinh tế. Tuy nhiên, nó cũng tạo ra các rào cản thương mại ngoại khối, buộc các quốc gia ngoài khối phải điều chỉnh chính sách thương mại và nâng cao năng lực cạnh tranh.", "items": [{"text": "a) Khu vực hóa kinh tế thúc đẩy tự do hóa thương mại và đầu tư giữa các quốc gia thành viên trong cùng tổ chức.", "correct": true}, {"text": "b) Các tổ chức liên kết khu vực như EU, ASEAN được hình thành hoàn toàn dựa trên sự đồng nhất tuyệt đối về trình độ phát triển kinh tế.", "correct": false}, {"text": "c) Sự xuất hiện của các rào cản thương mại ngoại khối do khu vực hóa tạo ra gây ra nhiều thách thức về xuất khẩu cho các nước không thuộc khối liên kết.", "correct": true}, {"text": "d) Chiến lược thích ứng hiệu quả nhất cho một quốc gia đang phát triển trước xu thế khu vực hóa là chủ động gia tăng rào cản thuế quan và khép kín thị trường nội địa.", "correct": false}]},
      {"title": "Câu 2. Mạch kiến thức: An ninh năng lượng toàn cầu", "passage": "An ninh năng lượng là sự đảm bảo đầy đủ năng lượng dưới nhiều hình thức khác nhau để phục vụ nhu cầu đời sống và hoạt động kinh tế – xã hội. Hiện nay, an ninh năng lượng toàn cầu bị đe dọa bởi sự cạn kiệt nguồn nhiên liệu hóa thạch, biến động giá dầu và xung đột địa chính trị. Để đảm bảo an ninh năng lượng bền vững, các quốc gia đang đẩy mạnh tiết kiệm năng lượng, chuyển dịch sang năng lượng tái tạo và tăng cường hợp tác quốc tế.", "items": [{"text": "a) An ninh năng lượng đóng vai trò là tiền đề quan trọng cho sự ổn định và phát triển kinh tế – xã hội của mọi quốc gia.", "correct": true}, {"text": "b) Nguồn nhiên liệu hóa thạch như dầu mỏ, than đá là các tài nguyên vô tận, không chịu rủi ro cạn kiệt.", "correct": false}, {"text": "c) Phát triển năng lượng tái tạo (điện gió, điện mặt trời) vừa giúp đảm bảo an ninh năng lượng vừa góp phần giảm phát thải khí nhà kính.", "correct": true}, {"text": "d) Giải pháp duy nhất để giải quyết triệt để khủng hoảng an ninh năng lượng là tăng cường khai thác tối đa tài nguyên dầu mỏ và than đá bằng mọi giá.", "correct": false}]},

/* ===== TIỆN ÍCH ===== */
const COLORS = {
  indigo:  {grad:'from-indigo-500 to-indigo-700',  btn:'bg-indigo-600 hover:bg-indigo-700',  soft:'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-300',   bar:'bg-indigo-500',  tab:'border-indigo-500 text-indigo-600 dark:text-indigo-400'},
  emerald: {grad:'from-emerald-500 to-teal-700',   btn:'bg-emerald-600 hover:bg-emerald-700',soft:'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300',bar:'bg-emerald-500', tab:'border-emerald-500 text-emerald-600 dark:text-emerald-400'},
  amber:   {grad:'from-amber-500 to-orange-600',   btn:'bg-amber-600 hover:bg-amber-700',    soft:'bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300',       bar:'bg-amber-500',   tab:'border-amber-500 text-amber-600 dark:text-amber-400'},
  rose:    {grad:'from-rose-500 to-red-700',       btn:'bg-rose-600 hover:bg-rose-700',      soft:'bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300',           bar:'bg-rose-500',    tab:'border-rose-500 text-rose-600 dark:text-rose-400'},
  blue:    {grad:'from-blue-500 to-blue-700',      btn:'bg-blue-600 hover:bg-blue-700',      soft:'bg-blue-50 text-blue-700 dark:bg-blue-950/60 dark:text-blue-300',           bar:'bg-blue-500',    tab:'border-blue-500 text-blue-600 dark:text-blue-400'}
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
const LET = ['A','B','C','D'];
const card = 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm';
const isDark = () => document.documentElement.classList.contains('dark');
const total2 = d => d.p2.reduce((s,q)=>s+q.items.length,0);

let S = {view:'hub'};

function start(id){
  const d = subjectData[id]; if(!d) return;
  S = {view:'quiz', sub:d, tab:1,
    p1:{qs:shuffle(d.p1).map(q=>({q:q.q, o:shuffle(q.options.map((t,i)=>({t, ok:i===q.answer})))})), i:0, score:0, pick:null, done:false},
    p2:{qs:shuffle(d.p2), i:0, score:0, ans:{}, checked:false, done:false}};
  render(); window.scrollTo(0,0);
}
function go(id){ if(location.hash==='#'+id) start(id); else location.hash = id; }
function route(){
  const id = location.hash.slice(1);
  if(id && subjectData[id]){ if(!(S.sub && S.sub.id===id && S.view!=='hub')) start(id); }
  else { S={view:'hub'}; render(); }
}
window.addEventListener('hashchange', route);

/* ===== VIEWS ===== */
function themeBtn(){
  return `<button data-act="theme" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700" aria-label="Đổi giao diện sáng/tối">${isDark()?'☀️ Sáng':'🌙 Tối'}</button>`;
}

function hub(){
  const cards = Object.values(subjectData).map(d=>{
    const c = COLORS[d.color]||COLORS.blue;
    return `<div class="${card} overflow-hidden flex flex-col">
      <div class="bg-gradient-to-br ${c.grad} text-white p-5"><div class="text-4xl mb-2" aria-hidden="true">${d.icon}</div>
        <h2 class="text-xl font-extrabold">${esc(d.title)}</h2><p class="text-sm opacity-90">${esc(d.subtitle)}</p></div>
      <div class="p-5 flex flex-col gap-4 flex-1">
        <p class="text-sm text-slate-600 dark:text-slate-300 flex-1">${esc(d.desc)}</p>
        <div class="flex flex-wrap gap-2 text-xs font-semibold">
          <span class="px-2.5 py-1 rounded-full ${c.soft}">${d.p1.length} câu trắc nghiệm</span>
          <span class="px-2.5 py-1 rounded-full ${c.soft}">${d.p2.length} câu Đúng/Sai (${total2(d)} ý)</span></div>
        <button data-act="open" data-id="${esc(d.id)}" class="w-full ${c.btn} text-white font-semibold py-2.5 rounded-xl transition">Bắt đầu ôn tập</button>
      </div></div>`;}).join('');
  return `<header class="flex items-center justify-between gap-3 mb-6">
      <div><h1 class="text-2xl sm:text-3xl font-extrabold">Ôn Tập Trắc Nghiệm</h1><p class="text-sm text-slate-500 dark:text-slate-400">Chọn môn học để bắt đầu</p></div>${themeBtn()}</header>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${cards}</div>`;
}

function quiz(){
  const d=S.sub, c=COLORS[d.color]||COLORS.blue;
  const tabs=[[1,'Phần I · Trắc nghiệm'],[2,'Phần II · Đúng / Sai']].map(([n,l])=>
    `<button data-act="tab" data-n="${n}" class="flex-1 py-3 text-sm font-semibold border-b-2 ${S.tab===n?c.tab:'border-transparent text-slate-500 dark:text-slate-400'}">${l}${S['p'+n].done?' ✓':''}</button>`).join('');
  return `<header class="flex items-center justify-between gap-2 mb-4">
      <button data-act="home" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700">‹ Chọn môn khác</button>
      <div class="flex gap-2"><button data-act="finish" class="px-3 py-2 rounded-xl text-sm font-semibold text-white ${c.btn}">Nộp bài</button>${themeBtn()}</div></header>
    <h1 class="text-xl sm:text-2xl font-extrabold mb-3">${d.icon} ${esc(d.title)}</h1>
    <div class="flex ${card} mb-4 overflow-hidden">${tabs}</div>
    ${S.tab===1?part1(c):part2(c)}`;
}

function progress(c, i, n, score, label){
  return `<div class="flex justify-between text-sm font-semibold mb-2"><span>Câu ${Math.min(i+1,n)} / ${n}</span><span>${label}: ${score}</span></div>
    <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden mb-5"><div class="h-full ${c.bar} transition-all" style="width:${Math.round(i/n*100)}%"></div></div>`;
}

function donePanel(n, c){
  const p=S['p'+n], other=S['p'+(3-n)];
  const txt = n===1 ? `${p.score} / ${p.qs.length} câu đúng` : `${p.score} / ${total2(S.sub)} ý đúng`;
  const nextBtn = other.done
    ? `<button data-act="finish" class="${c.btn} text-white font-semibold px-5 py-2.5 rounded-xl">Xem kết quả tổng</button>`
    : `<button data-act="tab" data-n="${3-n}" class="${c.btn} text-white font-semibold px-5 py-2.5 rounded-xl">Sang Phần ${n===1?'II':'I'}</button>`;
  return `<div class="${card} p-6 text-center"><div class="text-4xl mb-2">🎉</div><h2 class="text-lg font-bold mb-1">Hoàn thành Phần ${n===1?'I':'II'}</h2>
    <p class="text-slate-600 dark:text-slate-300 mb-4">${txt}</p>${nextBtn}</div>`;
}

function part1(c){
  const p=S.p1, n=p.qs.length;
  if(p.done) return donePanel(1,c);
  const q=p.qs[p.i], answered=p.pick!==null;
  const opts=q.o.map((o,k)=>{
    let cls='border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700';
    if(answered){ if(o.ok) cls='bg-green-500 border-green-600 text-white'; else if(k===p.pick) cls='bg-red-500 border-red-600 text-white'; else cls='border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 opacity-60'; }
    return `<button data-act="pick" data-k="${k}" ${answered?'disabled':''} class="w-full text-left flex gap-3 items-start rounded-xl border-2 px-4 py-3 transition ${cls}">
      <span class="shrink-0 w-7 h-7 rounded-full bg-black/10 dark:bg-white/10 flex items-center justify-center text-sm font-bold">${LET[k]}</span><span class="pt-0.5">${esc(o.t)}</span></button>`;}).join('');
  let fb='';
  if(answered){ const ok=q.o[p.pick].ok, right=q.o.findIndex(o=>o.ok);
    fb=`<div role="status" class="mt-4 p-3 rounded-xl text-sm font-medium ${ok?'bg-green-50 text-green-800 dark:bg-green-950/50 dark:text-green-300':'bg-red-50 text-red-800 dark:bg-red-950/50 dark:text-red-300'}">${ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án đúng là ${LET[right]}: ${esc(q.o[right].t)}`}</div>
      <button data-act="next1" class="mt-4 w-full ${c.btn} text-white font-semibold py-3 rounded-xl">${p.i+1<n?'Câu tiếp theo →':'Hoàn thành Phần I'}</button>`; }
  return `${progress(c,p.i,n,p.score,'Điểm')}<div class="${card} p-5">
    <h2 class="text-lg font-semibold mb-4 leading-snug">${esc(q.q)}</h2><div class="flex flex-col gap-3">${opts}</div>${fb}</div>`;
}

function part2(c){
  const p=S.p2, n=p.qs.length;
  if(p.done) return donePanel(2,c);
  const q=p.qs[p.i];
  const title=(q.title||'').replace(/^Câu\s*\d+\s*[.:]\s*/,'');
  const items=q.items.map((it,k)=>{
    const a=p.ans[k]; let box='border-slate-200 dark:border-slate-700', res='';
    if(p.checked){ const ok=a===it.correct; box=ok?'border-green-500 bg-green-50 dark:bg-green-950/40':'border-red-500 bg-red-50 dark:bg-red-950/40';
      res=`<p class="mt-2 text-xs font-semibold ${ok?'text-green-700 dark:text-green-300':'text-red-700 dark:text-red-300'}">${ok?'✅ Chính xác':'❌ Sai'} · Đáp án: ${it.correct?'Đúng':'Sai'}</p>`; }
    const b=(v,l)=>`<button data-act="set" data-k="${k}" data-v="${v}" ${p.checked?'disabled':''} class="px-5 py-2 rounded-lg border-2 text-sm font-semibold transition ${a===v?(v?'bg-green-500 border-green-600 text-white':'bg-red-500 border-red-600 text-white'):'border-slate-200 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700'}">${l}</button>`;
    return `<div class="rounded-xl border-2 p-4 ${box}"><p class="mb-3 text-sm sm:text-base">${esc(it.text)}</p><div class="flex gap-2">${b(true,'Đúng')}${b(false,'Sai')}</div>${res}</div>`;}).join('');
  const all=q.items.every((_,k)=>k in p.ans);
  let act;
  if(!p.checked) act=`<button data-act="check2" ${all?'':'disabled'} class="mt-4 w-full ${c.btn} text-white font-semibold py-3 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed">Kiểm tra kết quả</button>`;
  else { const g=q.items.filter((it,k)=>p.ans[k]===it.correct).length;
    act=`<div role="status" class="mt-4 p-3 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-700">Bạn đúng ${g} / ${q.items.length} ý.</div>
      <button data-act="next2" class="mt-3 w-full ${c.btn} text-white font-semibold py-3 rounded-xl">${p.i+1<n?'Câu tiếp theo →':'Hoàn thành Phần II'}</button>`; }
  return `${progress(c,p.i,n,p.score,'Số ý đúng')}<div class="${card} p-5">
    <h2 class="text-base font-bold mb-3">${esc(title)}</h2>
    ${q.passage?`<blockquote class="mb-4 p-4 rounded-xl bg-slate-100 dark:bg-slate-900/60 border-l-4 border-slate-400 text-sm leading-relaxed italic">${esc(q.passage)}</blockquote>`:''}
    <div class="flex flex-col gap-3">${items}</div>${act}</div>`;
}

function result(){
  const d=S.sub, c=COLORS[d.color]||COLORS.blue;
  const n1=S.p1.qs.length, n2=total2(d), s1=S.p1.score, s2=S.p2.score;
  const pct=Math.round((s1+s2)/(n1+n2)*100);
  const [lv,msg]= pct>=90?['Xuất sắc','🏆 Bạn nắm kiến thức rất vững!']: pct>=80?['Giỏi','🌟 Kết quả rất tốt, ôn thêm vài chỗ nữa là hoàn hảo.']: pct>=65?['Khá','👍 Khá ổn, hãy xem lại các câu sai.']: pct>=50?['Trung bình','📚 Cần ôn kỹ hơn để chắc kiến thức.']:['Cần cố gắng','💪 Đừng nản, làm lại để tiến bộ nhé!'];
  const row=(l,v,t)=>`<div class="flex justify-between items-center py-3 border-b last:border-0 border-slate-100 dark:border-slate-700"><span>${l}</span><span class="font-bold">${v} / ${t}</span></div>`;
  return `<header class="flex justify-end mb-4">${themeBtn()}</header>
    <div class="${card} p-6 text-center">
      <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">${d.icon} ${esc(d.title)}</p>
      <div class="my-4 mx-auto w-32 h-32 rounded-full bg-gradient-to-br ${c.grad} text-white flex flex-col items-center justify-center"><span class="text-4xl font-extrabold">${pct}%</span></div>
      <h2 class="text-2xl font-extrabold">${lv}</h2><p class="text-slate-600 dark:text-slate-300 mt-1 mb-5">${msg}</p>
      <div class="text-left mb-6">${row('Phần I · Câu trắc nghiệm đúng',s1,n1)}${row('Phần II · Ý Đúng/Sai đúng',s2,n2)}${row('Tổng điểm',s1+s2,n1+n2)}</div>
      <div class="flex flex-col sm:flex-row gap-3">
        <button data-act="restart" class="flex-1 ${c.btn} text-white font-semibold py-3 rounded-xl">Làm lại bài này (Xáo trộn mới)</button>
        <button data-act="home" class="flex-1 border border-slate-300 dark:border-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">Đổi môn học</button></div></div>`;
}

function render(){ $.innerHTML = S.view==='hub'?hub(): S.view==='result'?result(): quiz(); }
const $ = document.getElementById('app');

/* ===== SỰ KIỆN ===== */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, top=()=>window.scrollTo({top:0});
  if(a==='open') go(b.dataset.id);
  else if(a==='home'){ if(location.hash) location.hash=''; else {S={view:'hub'};render();} top(); return; }
  else if(a==='theme'){ const on=document.documentElement.classList.toggle('dark'); try{localStorage.setItem('theme',on?'dark':'light')}catch(_){} }
  else if(a==='tab'){ S.tab=+b.dataset.n; top(); }
  else if(a==='pick'){ const p=S.p1; if(p.pick!==null) return; p.pick=+b.dataset.k; if(p.qs[p.i].o[p.pick].ok) p.score++; }
  else if(a==='next1'){ const p=S.p1; if(p.i+1<p.qs.length){p.i++;p.pick=null;} else p.done=true; top(); }
  else if(a==='set'){ const p=S.p2; if(p.checked) return; p.ans[+b.dataset.k]=b.dataset.v==='true'; }
  else if(a==='check2'){ const p=S.p2; p.qs[p.i].items.forEach((it,k)=>{ if(p.ans[k]===it.correct) p.score++; }); p.checked=true; }
  else if(a==='next2'){ const p=S.p2; if(p.i+1<p.qs.length){p.i++;p.ans={};p.checked=false;} else p.done=true; top(); }
  else if(a==='finish'){ S.view='result'; top(); }
  else if(a==='restart') { start(S.sub.id); return; }
  render();
});

route();
</script>
